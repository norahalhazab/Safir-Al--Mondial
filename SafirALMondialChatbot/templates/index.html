<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safir AL-Mondial Chatbot</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: url('{{ url_for("static", filename="background.png") }}') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 290px;
      height: 580px;
      border-radius: 25px;
      background: #fff9f3;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .chat-container::before {
      content: '';
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background-image: url('{{ url_for("static", filename="football_background.png") }}');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      font-size: 16px;
      font-weight: bold;
      background-color: #171B36;
      color: #FFF9F3;
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      width: 100%;
    }

   /* Glowing Soccer Ball */
.soccer-ball-glow {
  width: 70px;  /* Match the size of the football icon */
  height: 70px; /* Match the size of the football icon */
  border-radius: 50%;
  background: radial-gradient(circle, #FDC7F7 40%, #6E00A5);
  box-shadow: 0 0 20px 8px #C965FF;
  display: flex;
  align-items: center;
  justify-content: center;

  margin: -24px auto 10px auto; /* Adjusted margin to move the glow upwards */
  z-index: 1;
}

.soccer-pattern {
  width: 90px;  /* Increase the size of the football icon */
  height: 90px;
  background-image: url('{{ url_for("static", filename="football-icon.png") }}');
  background-size: cover;
  border-radius: 50%;
  margin-left: -10px;  /* Move the football icon to the left */

  z-index: 2; /* Ensure the football icon is on top of the glowing ball */
}


    .chat-history {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      position: relative;
      z-index: 1;
      background: transparent;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 20px;
      max-width: 75%;
      font-size: 13px;
      line-height: 1.4;
      position: relative;
    }

    .message.You {
      background-color: #A154A2;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .message.Bot {
      background-color: #f6f2f0;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .chat-input {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background-color: transparent;
      border-top: none;
      position: relative;
      z-index: 2;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 40px 10px 12px;
      background-color: #FFF9F3;
      border: 1px solid #8A8A8A;
      border-radius: 20px;
      outline: none;
      font-size: 13px;
      color: #000;
      background-image: url('/static/mic-icon.png');
      background-repeat: no-repeat;
      background-size: 16px;
      background-position: right 12px center;
      position: relative;
      top: -6px;
    }

    .chat-input button {
      width: 36px;
      height: 36px;
      margin-left: 8px;
      cursor: pointer;
      background-image: url('{{ url_for("static", filename="football_send.png") }}');
      background-size: 53px 53px;
      background-position: 48% 23%;
      background-repeat: no-repeat;
      border: none;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(47, 71, 233, 0.4);
      position: relative;
    }

    .chat-input button.clicked {
      box-shadow: 0 0 12px rgba(47, 71, 233, 0.8);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Safir AL-Mondial Chatbot
    </div>

    <!-- Glowing Soccer Ball Here -->
    <div class="soccer-ball-glow">
      <div class="soccer-pattern"></div>
    </div>

    <div class="chat-history" id="chatHistory"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your message...">
      <button onclick="sendMessage()" id="sendButton"></button>
    </div>
  </div>

  <script>
    function appendMessage(sender, message) {
      const chatHistory = document.getElementById('chatHistory');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      messageDiv.innerHTML = message;
      chatHistory.appendChild(messageDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function sendMessage() {
      const userInput = document.getElementById('userInput');
      const message = userInput.value.trim();

      if (message) {
        appendMessage('You', message);

        fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `message=${encodeURIComponent(message)}`
        })
        .then(response => response.json())
        .then(data => {
          appendMessage('Bot', data.response);
        });

        userInput.value = '';
      }

      const sendButton = document.getElementById('sendButton');
      sendButton.classList.add('clicked');

      setTimeout(() => {
        sendButton.classList.remove('clicked');
      }, 500);
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
